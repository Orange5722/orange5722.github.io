<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李佳康大傻福</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #07070d;
    overflow: hidden;
  }
  .headline {
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(40px, 15vw, 220px);
    line-height: 1.1;
    letter-spacing: 0.06em;
    white-space: nowrap;
    color: #ff4d8d;
    background-image: linear-gradient(90deg,
      #ff2d55, #ff9500, #ffd60a, #34c759, #00c7be, #0a84ff, #bf5af2, #ff2d55);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow-flow 7s linear infinite;
    filter: drop-shadow(0 0 28px rgba(140, 90, 255, 0.45));
  }
  @keyframes rainbow-flow {
    from { background-position: 0% 50%; }
    to   { background-position: 300% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .headline { animation: none; color: #ff4d8d; -webkit-text-fill-color: #ff4d8d; }
  }
</style>
</head>
<body>
  <h1 class="headline">李佳康大傻福</h1>
  <script src="/agent-pages/_assets/nav.js" defer></script>
</body>
</html>
