<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>扫雷 · Minesweeper</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <header class="head">
    <h1>扫雷</h1>
    <div class="levels" id="levels">
      <button data-level="easy" class="lv active">初级</button>
      <button data-level="medium" class="lv">中级</button>
      <button data-level="hard" class="lv">高级</button>
    </div>
  </header>

  <section class="hud">
    <div class="stat" title="剩余雷数">
      <span class="stat-ico">💣</span>
      <span id="mineCount">10</span>
    </div>
    <button id="face" class="face" title="重新开始">🙂</button>
    <div class="stat" title="用时（秒）">
      <span class="stat-ico">⏱</span>
      <span id="timer">0</span>
    </div>
  </section>

  <div class="board-wrap">
    <div id="board" class="board" aria-label="扫雷棋盘"></div>
    <div id="overlay" class="overlay hidden">
      <p id="overlayText"></p>
      <button id="againBtn" class="again">再来一局</button>
    </div>
  </div>

  <p class="hint">
    左键挖开 · 右键插旗 · 双击数字快速展开
    <span class="mobile-hint">· 手机：长按插旗，或点下方按钮切换模式</span>
  </p>

  <button id="flagMode" class="flag-mode" aria-pressed="false">
    <span class="fm-ico">⛏</span> 挖开模式（点击切换为插旗）
  </button>

  <p class="best" id="best"></p>
</main>

<script src="/agent-pages/assets/nav.js?v=1" defer></script>
<script src="./game.js?v=2"></script>
</body>
</html>
