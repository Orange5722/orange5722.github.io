<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面列表 · Agent Pages</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(900px 500px at 50% -10%, #16203c 0%, #07070d 60%);
    color: #e8e8f0; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: min(600px, 90vw); padding: 40px 0; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
  .brand { font-size: 12px; letter-spacing: .22em; color: #6f7590; margin-bottom: 8px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: .06em; }
  .who { text-align: right; font-size: 12.5px; color: #8b90a8; line-height: 1.7; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
    border: 1px solid #2b3a63; background: #16203c; color: #8fb8ff;
  }
  .badge.admin { border-color: #5b4a12; background: #3a2f0d; color: #ffd166; }
  .who button {
    margin-top: 6px; padding: 4px 12px; font-size: 12px; border-radius: 8px;
    border: 1px solid #23233a; background: transparent; color: #b9bfd6; cursor: pointer;
    font-family: inherit;
  }
  .who button:hover { background: #17172a; }

  h2.section-title {
    font-size: 13px; color: #8b90a8; font-weight: 600; letter-spacing: .1em;
    margin: 26px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #23233a;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li + li { margin-top: 12px; }
  a.card {
    display: block; padding: 16px 20px; border-radius: 13px; text-decoration: none;
    color: #e8e8f0; background: #12121c; border: 1px solid #1e1e2e;
    transition: border-color .18s, transform .18s;
  }
  a.card:hover { border-color: #3f4e86; transform: translateY(-2px); }
  .card .t { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card .d { font-size: 12.5px; color: #8b90a8; line-height: 1.5; }
  .card .u { font-size: 11.5px; color: #5c6079; margin-top: 6px; word-break: break-all; }
  .locked { font-size: 12.5px; color: #5c6079; margin-top: 18px; }
  .empty { font-size: 13px; color: #8b90a8; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="brand">AGENT PAGES</div>
      <h1>页面列表</h1>
    </div>
    <div class="who" id="who" style="visibility:hidden">
      <div><span id="uname"></span> <span id="roleBadge" class="badge"></span></div>
      <button id="logout">退出登录</button>
    </div>
  </header>

  <div id="content" class="hidden">
    <div id="sections"></div>
    <p class="locked" id="lockedTip"></p>
  </div>
  <p class="empty hidden" id="loading">正在验证登录状态…</p>
</main>

<script src="/agent-pages/assets/nav.js?v=1" defer></script>
<script>
(function () {
  var API = "https://api.oorange.cn";
  var TOKEN_KEY = "memo_token";
  var USER_KEY = "memo_user";

  var PAGES = [
    { href: "/agent-pages/friends/", title: "朋友们的页面", desc: "给朋友做的整活页面合集", role: "guest" },
    { href: "/agent-pages/memo/", title: "备忘录 Memo", desc: "登录后可读写自己的备忘", role: "guest" },
    { href: "/agent-pages/bookmarks/", title: "网页收藏夹", desc: "全部书签，按用途分类", role: "admin" }
  ];

  var $ = function (id) { return document.getElementById(id); };

  function goLogin() {
    location.replace("/agent-pages/login/?next=" + encodeURIComponent("/agent-pages/"));
  }

  var token = localStorage.getItem(TOKEN_KEY);
  if (!token) return goLogin();

  fetch(API + "/api/me", { headers: { Authorization: "Bearer " + token } })
    .then(function (r) {
      if (r.status === 401) { localStorage.removeItem(TOKEN_KEY); goLogin(); throw new Error("unauth"); }
      return r.json();
    })
    .then(function (me) {
      render(me);
    })
    .catch(function (e) {
      if (e && e.message === "unauth") return;
      $("loading").textContent = "无法连接服务器：" + (e && e.message ? e.message : e);
    });

  function render(me) {
    var isAdmin = me.role === "admin";

    $("uname").textContent = me.username;
    var b = $("roleBadge");
    b.textContent = isAdmin ? "管理员" : "访客";
    b.className = "badge" + (isAdmin ? " admin" : "");
    $("who").style.visibility = "visible";

    var groups = [
      { title: "公开页面", items: PAGES.filter(function (p) { return p.role === "guest"; }) },
      { title: "管理员页面", items: PAGES.filter(function (p) { return p.role === "admin"; }) }
    ];

    var host = $("sections");
    var hiddenCount = 0;

    groups.forEach(function (g) {
      if (!g.items.length) return;
      var visible = isAdmin ? g.items : g.items.filter(function (p) { return p.role !== "admin"; });
      hiddenCount += g.items.length - visible.length;
      if (!visible.length) return;

      var h = document.createElement("h2");
      h.className = "section-title";
      h.textContent = g.title;
      host.appendChild(h);

      var ul = document.createElement("ul");
      visible.forEach(function (p) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.className = "card";
        a.href = p.href;

        var t = document.createElement("div"); t.className = "t"; t.textContent = p.title;
        var d = document.createElement("div"); d.className = "d"; d.textContent = p.desc;
        var u = document.createElement("div"); u.className = "u"; u.textContent = p.href;

        a.append(t, d, u);
        li.appendChild(a);
        ul.appendChild(li);
      });
      host.appendChild(ul);
    });

    if (hiddenCount > 0) {
      $("lockedTip").textContent = "还有 " + hiddenCount + " 个页面需要管理员权限才能查看。";
    }

    $("loading").classList.add("hidden");
    $("content").classList.remove("hidden");
  }

  $("logout").addEventListener("click", function () {
    fetch(API + "/api/logout", {
      method: "POST",
      headers: { Authorization: "Bearer " + token }
    }).catch(function () {}).then(function () {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
      location.replace("/agent-pages/login/");
    });
  });
})();
</script>
</body>
</html>
