<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面列表 · Agent Pages</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(900px 500px at 50% -10%, #16203c 0%, #07070d 60%);
    color: #e8e8f0; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: min(620px, 90vw); padding: 40px 0; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .brand { font-size: 12px; letter-spacing: .22em; color: #6f7590; margin-bottom: 8px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: .06em; }
  .who { text-align: right; font-size: 12.5px; color: #8b90a8; line-height: 1.8; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
    border: 1px solid #2b3a63; background: #16203c; color: #8fb8ff;
  }
  .badge.admin { border-color: #5b4a12; background: #3a2f0d; color: #ffd166; }
  .badge.guest { border-color: #333a4d; background: #171a24; color: #9aa3bd; }
  .who button {
    margin-top: 6px; padding: 5px 12px; font-size: 12px; border-radius: 8px;
    border: 1px solid #23233a; background: transparent; color: #b9bfd6; cursor: pointer;
    font-family: inherit;
  }
  .who button:hover { background: #17172a; }
  .who button.primary { background: #2f6bff; border-color: #2f6bff; color: #fff; }
  .who button.primary:hover { background: #4a80ff; }

  h2.section-title {
    font-size: 13px; color: #8b90a8; font-weight: 600; letter-spacing: .1em;
    margin: 26px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #23233a;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li + li { margin-top: 12px; }
  a.card {
    display: block; padding: 16px 20px; border-radius: 13px; text-decoration: none;
    color: #e8e8f0; background: #12121c; border: 1px solid #1e1e2e;
    transition: border-color .18s, transform .18s;
  }
  a.card:hover { border-color: #3f4e86; transform: translateY(-2px); }
  .card .t { font-size: 15px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .card .d { font-size: 12.5px; color: #8b90a8; line-height: 1.5; }
  .card .u { font-size: 11.5px; color: #5c6079; margin-top: 6px; word-break: break-all; }
  .tag {
    font-size: 10.5px; font-weight: 500; padding: 1px 7px; border-radius: 999px;
    border: 1px solid #3a3a2a; color: #d8b45a; background: #241f10;
  }
  .tag.admin { border-color: #4a3a12; color: #ffd166; background: #2a220c; }
  .empty { font-size: 13px; color: #8b90a8; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="brand">AGENT PAGES</div>
      <h1>页面列表</h1>
    </div>
    <div class="who" id="who">
      <div id="whoLine"><span class="badge guest" id="roleBadge">游客</span></div>
      <button id="authBtn" class="primary">登录 / 注册</button>
    </div>
  </header>

  <div id="sections"></div>
  <p class="empty hidden" id="loading">加载中…</p>
</main>

<script src="/agent-pages/assets/auth.js"></script>
<script src="/agent-pages/assets/pages.js"></script>
<script src="/agent-pages/assets/nav.js?v=1" defer></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var isAdmin = false;

  function renderGuest() {
    $("whoLine").innerHTML = '<span class="badge guest">游客</span>';
    $("authBtn").textContent = "登录 / 注册";
    $("authBtn").className = "primary";
    renderPages();
  }

  function renderUser(me) {
    isAdmin = me.role === "admin";
    var b = document.createElement("span");
    b.className = "badge" + (isAdmin ? " admin" : "");
    b.textContent = isAdmin ? "管理员" : "已登录";
    $("whoLine").textContent = me.username + " ";
    $("whoLine").appendChild(b);

    $("authBtn").textContent = "退出登录";
    $("authBtn").className = "";
    renderPages();
  }

  function renderPages() {
    var host = $("sections");
    host.innerHTML = "";

    var list = (window.APS_PAGES || []).filter(function (p) {
      // 管理员页面：非管理员连条目都不显示
      if (p.access === "admin" && !isAdmin) return false;
      return true;
    });

    var groups = [
      { title: "公开页面", items: list.filter(function (p) { return p.access === "public"; }) },
      { title: "需要登录", items: list.filter(function (p) { return p.access === "auth"; }) },
      { title: "管理员页面", items: list.filter(function (p) { return p.access === "admin"; }) }
    ];

    groups.forEach(function (g) {
      if (!g.items.length) return;

      var h = document.createElement("h2");
      h.className = "section-title";
      h.textContent = g.title;
      host.appendChild(h);

      var ul = document.createElement("ul");
      g.items.forEach(function (p) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.className = "card";

        // 游客点「需要登录」的页面 → 引导去登录，登录后回跳
        if (p.access === "auth" && !APS.isLoggedIn()) {
          a.href = APS.loginUrl(p.href);
        } else {
          a.href = p.href;
        }

        var t = document.createElement("div");
        t.className = "t";
        t.textContent = p.title;
        if (p.access === "auth" && !APS.isLoggedIn()) {
          var tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = "需登录";
          t.appendChild(tag);
        }
        if (p.access === "admin") {
          var tag2 = document.createElement("span");
          tag2.className = "tag admin";
          tag2.textContent = "管理员";
          t.appendChild(tag2);
        }

        var d = document.createElement("div");
        d.className = "d";
        d.textContent = p.desc || "";

        var u = document.createElement("div");
        u.className = "u";
        u.textContent = p.href;

        a.append(t, d, u);
        li.appendChild(a);
        ul.appendChild(li);
      });
      host.appendChild(ul);
    });

    $("loading").classList.add("hidden");
  }

  $("authBtn").addEventListener("click", function () {
    if (APS.isLoggedIn()) APS.logout();
    else location.href = APS.loginUrl("/agent-pages/");
  });

  // 有 token 就确认一下身份；401 视为游客，不强制跳登录
  if (APS.isLoggedIn()) {
    APS.me().then(renderUser).catch(function () {
      try { localStorage.removeItem("memo_token"); localStorage.removeItem("memo_user"); } catch (e) {}
      renderGuest();
    });
  } else {
    renderGuest();
  }
})();
</script>
</body>
</html>
