<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · Agent Pages</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(900px 500px at 50% -10%, #16203c 0%, #07070d 60%);
    color: #e8e8f0; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(400px, 90vw); background: #12121c; border: 1px solid #23233a;
    border-radius: 18px; padding: 34px 30px 28px;
  }
  .brand { font-size: 12px; letter-spacing: .22em; color: #6f7590; margin-bottom: 10px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: .06em; }
  .sub { font-size: 13px; color: #8b90a8; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: #8b90a8; margin-bottom: 14px; }
  input {
    width: 100%; margin-top: 7px; padding: 12px 13px; border-radius: 11px;
    border: 1px solid #23233a; background: #0c0c15; color: #e8e8f0;
    font-size: 15px; font-family: inherit; outline: none; transition: border-color .18s;
  }
  input:focus { border-color: #4b7bff; }
  button {
    width: 100%; margin-top: 6px; padding: 12px; border-radius: 11px; border: 1px solid transparent;
    background: #2f6bff; color: #fff; font-size: 15px; font-family: inherit; cursor: pointer;
    transition: background .18s, transform .12s;
  }
  button:hover { background: #4a80ff; }
  button:active { transform: scale(.985); }
  button.ghost { background: transparent; border-color: #23233a; color: #b9bfd6; margin-top: 10px; }
  button.ghost:hover { background: #17172a; }
  .msg { min-height: 20px; margin: 12px 0 0; font-size: 13px; color: #8b90a8; }
  .msg.err { color: #ff6b6b; }
  .msg.ok { color: #4ade80; }
  .foot { margin-top: 18px; font-size: 12.5px; color: #5c6079; text-align: center; }
  .foot a { color: #6f9bff; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">AGENT PAGES</div>
  <h1>登录</h1>
  <p class="sub">登录后查看你有权限访问的页面</p>

  <form id="form">
    <label>用户名
      <input id="username" type="text" autocomplete="username" required>
    </label>
    <label>密码
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" id="loginBtn">登录</button>
    <button type="button" id="registerBtn" class="ghost">注册新账号</button>
    <p id="msg" class="msg"></p>
  </form>

  <p class="foot"><a href="https://oorange.cn/">← 返回主站</a></p>
</div>

<script>
(function () {
  var API = "https://api.oorange.cn";
  var TOKEN_KEY = "memo_token";
  var USER_KEY = "memo_user";
  var $ = function (id) { return document.getElementById(id); };

  function next() {
    var q = new URLSearchParams(location.search).get("next");
    return q && q.indexOf("/agent-pages/") === 0 ? q : "/agent-pages/";
  }

  function setMsg(t, cls) {
    var el = $("msg");
    el.textContent = t || "";
    el.className = "msg" + (cls ? " " + cls : "");
  }

  function post(path, body) {
    return fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.error || ("请求失败 HTTP " + r.status));
        return d;
      });
    });
  }

  function login(username, password) {
    return post("/api/login", { username: username, password: password }).then(function (d) {
      localStorage.setItem(TOKEN_KEY, d.token);
      localStorage.setItem(USER_KEY, d.username || username);
      location.replace(next());
    });
  }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = $("username").value.trim();
    var p = $("password").value;
    if (!u || !p) return setMsg("用户名和密码都要填", "err");
    setMsg("登录中…");
    login(u, p).catch(function (err) { setMsg(err.message, "err"); });
  });

  $("registerBtn").addEventListener("click", function () {
    var u = $("username").value.trim();
    var p = $("password").value;
    if (!u || !p) return setMsg("先填好用户名和密码，再点注册", "err");
    setMsg("注册中…");
    post("/api/register", { username: u, password: p })
      .then(function () {
        setMsg("注册成功，正在登录…", "ok");
        return login(u, p);
      })
      .catch(function (err) { setMsg(err.message, "err"); });
  });

  // 已登录且 token 有效 → 直接进列表
  var token = localStorage.getItem(TOKEN_KEY);
  if (token) {
    fetch(API + "/api/me", { headers: { Authorization: "Bearer " + token } })
      .then(function (r) { if (r.ok) location.replace(next()); })
      .catch(function () {});
  }
})();
</script>
</body>
</html>
